name: Phase 4 shop-test DB preparation

on:
  push:
    branches: [phase-4-pos-customers-payments]
    paths:
      - '.github/workflows/phase4-shop-test-db.yml'

concurrency:
  group: phase4-shop-test-db
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live database starting point
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required'; exit 1; }

          READY=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          select (
            to_regclass('public.items') is not null and
            to_regclass('public.item_prices') is not null and
            to_regclass('public.purchase_bills') is not null and
            to_regclass('public.customers') is not null and
            to_regclass('public.sale_invoices') is not null and
            to_regclass('public.payments') is not null and
            to_regclass('public.payment_allocations') is not null and
            to_regclass('public.customer_invoice_outstanding') is not null and
            to_regprocedure('public.post_sale(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null and
            to_regprocedure('public.phase4_post_sale_unlocked(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null
          );
          SQL
          )
          if [ "$READY" = "t" ]; then
            echo "Live database is already Phase 4 ready; no migration required."
            echo "needs_upgrade=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_OK=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          select (
            to_regclass('public.tenants') is not null and
            to_regclass('public.tenant_users') is not null and
            to_regclass('public.shops') is not null and
            to_regclass('public.devices') is not null and
            to_regprocedure('public.set_user_role(uuid,text)') is not null
          );
          SQL
          )
          test "$BASE_OK" = "t" || { echo 'Live database is not at the expected Phase 1 base; refusing automatic upgrade.'; exit 1; }

          PARTIAL=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          with phase3_objects(name,present) as (
            values
              ('categories',to_regclass('public.categories') is not null),
              ('parties',to_regclass('public.parties') is not null),
              ('items',to_regclass('public.items') is not null),
              ('purchase_bills',to_regclass('public.purchase_bills') is not null),
              ('stock_movements',to_regclass('public.stock_movements') is not null)
          )
          select count(*) from phase3_objects where present;
          SQL
          )
          test "$PARTIAL" = "0" || { echo "Mixed/partial Phase 3 schema detected ($PARTIAL anchor objects exist); refusing automatic upgrade."; exit 1; }

          echo "needs_upgrade=true" >> "$GITHUB_OUTPUT"
          echo "Live database preflight: clean Phase 1 base; guarded Phase 3/4 upgrade required."

      - name: Install backup tools
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17

      - name: Configure backup destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF

      - name: Verify backup encryption recipient
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'AGE_PUBLIC_KEY does not match the expected offline key.'; exit 1; }

      - name: Create encrypted pre-migration backup
        if: steps.preflight.outputs.needs_upgrade == 'true'
        id: backup
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_RO_DATABASE_URL" || { echo 'BACKUP_RO_DATABASE_URL is required'; exit 1; }
          docker run --rm -v "$PWD:/dump" postgres:17             pg_dump --format=custom --schema=public "$BACKUP_RO_DATABASE_URL" -f /dump/phase4-pre.pgcustom
          sudo chown "$(id -u):$(id -g)" phase4-pre.pgcustom
          test "$(stat -c%s phase4-pre.pgcustom)" -ge 1000 || { echo 'Pre-migration dump is suspiciously small.'; exit 1; }
          age -r "$AGE_PUBLIC_KEY" -o phase4-pre.pgcustom.age phase4-pre.pgcustom
          SHA=$(sha256sum phase4-pre.pgcustom.age | cut -d' ' -f1)
          NAME="phase4-pre-migration-${GITHUB_SHA}.pgcustom.age"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload and verify pre-migration backup in both destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.backup.outputs.name }}"
          SHA="${{ steps.backup.outputs.sha }}"
          rclone copyto phase4-pre.pgcustom.age "b2:APD-BB/$NAME"
          test "$(rclone cat "b2:APD-BB/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          rclone copyto phase4-pre.pgcustom.age "r2:apd-dsb/$NAME"
          test "$(rclone cat "r2:apd-dsb/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          echo "Encrypted pre-migration backup verified in B2 and R2: $NAME"

      - name: Apply missing Phase 1/3/4 migrations atomically
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=()

          HAS_LABEL=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select exists(select 1 from information_schema.columns where table_schema='public' and table_name='devices' and column_name='label');")
          if [ "$HAS_LABEL" != "t" ]; then FILES+=(supabase/migrations/0014_device_label.sql); fi

          # 0015 is CREATE OR REPLACE and is safe to re-assert the owner-escalation boundary.
          FILES+=(supabase/migrations/0015_role_hardening.sql)

          HAS_TEAM=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select to_regprocedure('public.list_tenant_users_admin()') is not null;")
          if [ "$HAS_TEAM" != "t" ]; then FILES+=(supabase/migrations/0016_team_member_lifecycle.sql); fi

          for f in supabase/migrations/0017_master_data_purchases.sql                    supabase/migrations/0018_phase3_storage.sql                    supabase/migrations/0019_phase3_price_rpc.sql                    supabase/migrations/0020_phase3_tenant_integrity.sql                    supabase/migrations/0021_phase3_unit_semantics_fix.sql                    supabase/migrations/0022_phase4_stock_projection_customers.sql                    supabase/migrations/0023_phase4_sales_payments.sql                    supabase/migrations/0024_phase4_trigger_hardening.sql                    supabase/migrations/0025_phase4_allocation_integrity.sql                    supabase/migrations/0026_phase4_idempotency_locking.sql
          do
            FILES+=("$f")
          done

          ARGS=()
          for f in "${FILES[@]}"; do ARGS+=(-f "$f"); done
          echo "Applying ${#FILES[@]} guarded migration files in one transaction."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction "${ARGS[@]}"

      - name: Verify live Phase 4 schema and security contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          begin
            if to_regclass('public.items') is null
               or to_regclass('public.item_prices') is null
               or to_regclass('public.purchase_bills') is null
               or to_regclass('public.customers') is null
               or to_regclass('public.sale_invoices') is null
               or to_regclass('public.payments') is null
               or to_regclass('public.payment_allocations') is null
               or to_regclass('public.customer_invoice_outstanding') is null then
              raise exception 'Phase 4 live schema verification failed';
            end if;
            if not exists(
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relname='stock_current' and c.relkind in ('r','p')
            ) then raise exception 'stock_current is not a lockable table'; end if;
            if to_regprocedure('public.post_sale(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is null
               or to_regprocedure('public.record_customer_payment(uuid,uuid,date,bigint,text,text,jsonb,text)') is null
               or to_regprocedure('public.phase4_post_sale_unlocked(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is null then
              raise exception 'Phase 4 financial RPC verification failed';
            end if;
            if has_table_privilege('authenticated','public.sale_invoices','INSERT')
               or has_table_privilege('authenticated','public.payments','INSERT')
               or has_table_privilege('authenticated','public.stock_current','UPDATE') then
              raise exception 'Direct authenticated financial/stock write privilege detected';
            end if;
            if has_function_privilege('authenticated','public.phase4_post_sale_unlocked(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)','EXECUTE') then
              raise exception 'Authenticated role can execute unlocked sale function';
            end if;
            if not has_function_privilege('authenticated','public.post_sale(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)','EXECUTE') then
              raise exception 'Authenticated role cannot execute guarded post_sale';
            end if;
          end $$;
          select 'Live Supabase Phase 4 schema/security verification: PASS';
          SQL

name: CI

on:
  push:
    branches: [main, phase-4-pos-customers-payments, phase-5-offline-sync, phase-6-ledgers-reports-dr]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Clear stale Supabase containers
        run: docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Prove invite single-use under concurrent redemption
        run: node scripts/test-invite-concurrency.mjs
      - name: Prove sale stock locking and idempotency under concurrency
        run: node scripts/test-sale-concurrency.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Clear stale Supabase containers
        run: docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
      - run: supabase start
      - name: Export local Supabase URL/anon key
        run: |
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - run: supabase db reset
      - run: pnpm --filter @dsb-pro/admin run build
      - name: Install Playwright Chromium and OS dependencies
        run: |
          # GitHub's Ubuntu image carries a Google Chrome apt source that
          # Playwright does not need. During repository metadata rotations it
          # can return a transient Hash Sum mismatch and prevent the E2E suite
          # from even starting. Playwright downloads its own Chromium build.
          grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | while IFS= read -r source; do
            sudo rm -f "$source"
          done
          pnpm --filter @dsb-pro/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @dsb-pro/admin run e2e

  build:
    needs: [lint, typecheck, test, pgtap, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dsb-pro/admin run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist
      - name: Validate GitHub Pages fallback build and SPA deep-link fallback
        env:
          VITE_BASE_PATH: /dsb-pro/
        run: |
          pnpm --filter @dsb-pro/admin run build
          cp apps/admin/dist/index.html apps/admin/dist/404.html
          test -s apps/admin/dist/404.html
          grep -q '/dsb-pro/assets/' apps/admin/dist/index.html
          grep -q '/dsb-pro/assets/' apps/admin/dist/404.html

  phase4_db_readiness:
    needs: [build]
    if: github.ref == 'refs/heads/phase-4-pos-customers-payments' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Phase 4 database schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required for the shop-test readiness check'; exit 1; }
          MISSING=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          with required(name,present) as (
            values
              ('items', to_regclass('public.items') is not null),
              ('item_prices', to_regclass('public.item_prices') is not null),
              ('purchase_bills', to_regclass('public.purchase_bills') is not null),
              ('customers', to_regclass('public.customers') is not null),
              ('sale_invoices', to_regclass('public.sale_invoices') is not null),
              ('payments', to_regclass('public.payments') is not null),
              ('payment_allocations', to_regclass('public.payment_allocations') is not null),
              ('customer_invoice_outstanding', to_regclass('public.customer_invoice_outstanding') is not null),
              ('stock_current_table', exists(
                select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
                where n.nspname='public' and c.relname='stock_current' and c.relkind in ('r','p')
              )),
              ('post_purchase', to_regprocedure('public.post_purchase(uuid,uuid,text,date,bigint,bigint,text,jsonb,text)') is not null),
              ('post_sale', to_regprocedure('public.post_sale(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null),
              ('record_customer_payment', to_regprocedure('public.record_customer_payment(uuid,uuid,date,bigint,text,text,jsonb,text)') is not null),
              ('phase4_idempotency_wrapper', to_regprocedure('public.phase4_post_sale_unlocked(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null),
              ('legacy_import_runs', to_regclass('public.legacy_import_runs') is not null),
              ('legacy_import_rpc', to_regprocedure('public.import_legacy_dsb_master(uuid,jsonb,text)') is not null),
              ('day_reconciliation_rpc', to_regprocedure('public.get_shop_day_reconciliation(uuid,date)') is not null)
          )
          select name from required where not present order by name;
          SQL
          )
          if [ -n "$MISSING" ]; then
            echo "Live Supabase is not Phase 4 ready. Missing objects:"
            echo "$MISSING"
            exit 1
          fi
          echo "Live Supabase Phase 4 schema readiness: PASS"

  phase4_preview:
    needs: [build, phase4_db_readiness]
    if: github.ref == 'refs/heads/phase-4-pos-customers-payments' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Phase 4 preview config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'VITE_SUPABASE_URL is required'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'VITE_SUPABASE_ANON_KEY is required'; exit 1; }
      - name: Build Phase 4 shop-test preview
        env:
          VITE_TEST_MODE: phase4-shop-test
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: pnpm --filter @dsb-pro/admin run build
      - name: Deploy Phase 4 branch preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=dsb-pro --branch=phase-4-pos-customers-payments


  phase5_db_upgrade:
    needs: [build]
    if: github.ref == 'refs/heads/phase-5-offline-sync' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4

      - name: Inspect live Phase 5 database starting point
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required'; exit 1; }
          BASE_OK=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "
            select to_regprocedure('public.get_shop_day_reconciliation(uuid,date)') is not null
               and to_regprocedure('public.phase4_post_sale_unlocked(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null;")
          test "$BASE_OK" = "t" || { echo 'Live database is not at the verified Phase 4 base; refusing Phase 5 migration.'; exit 1; }

          PRESENT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          with checks(name,present) as (
            values
              ('device_sync_cursors',exists(select 1 from information_schema.columns where table_schema='public' and table_name='devices' and column_name='sync_cursors')),
              ('sync_conflicts',to_regclass('public.sync_conflicts') is not null),
              ('sync_idempotency_keys',to_regclass('public.sync_idempotency_keys') is not null),
              ('sync_pull',to_regprocedure('public.phase5_sync_pull(text,uuid,integer,jsonb)') is not null),
              ('sync_post_sale',to_regprocedure('public.phase5_sync_post_sale(text,integer,uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null)
          )
          select count(*) from checks where present;
          SQL
          )
          if [ "$PRESENT" = "5" ]; then
            echo "needs_upgrade=false" >> "$GITHUB_OUTPUT"
            echo "Live database already has the complete Phase 5 sync contract."
          elif [ "$PRESENT" = "0" ]; then
            echo "needs_upgrade=true" >> "$GITHUB_OUTPUT"
            echo "Live database is a clean Phase 4 base; Phase 5 migration is required."
          else
            echo "Partial Phase 5 schema detected ($PRESENT/5 anchors). Refusing automatic migration."
            exit 1
          fi

      - name: Install backup tools
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17

      - name: Configure backup destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF

      - name: Verify backup encryption recipient
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'AGE_PUBLIC_KEY does not match the expected offline key.'; exit 1; }

      - name: Create encrypted pre-Phase-5 backup
        if: steps.preflight.outputs.needs_upgrade == 'true'
        id: backup
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_RO_DATABASE_URL" || { echo 'BACKUP_RO_DATABASE_URL is required'; exit 1; }
          docker run --rm -v "$PWD:/dump" postgres:17             pg_dump --format=custom --schema=public "$BACKUP_RO_DATABASE_URL" -f /dump/phase5-pre.pgcustom
          sudo chown "$(id -u):$(id -g)" phase5-pre.pgcustom
          test "$(stat -c%s phase5-pre.pgcustom)" -ge 1000 || { echo 'Pre-migration dump is suspiciously small.'; exit 1; }
          age -r "$AGE_PUBLIC_KEY" -o phase5-pre.pgcustom.age phase5-pre.pgcustom
          SHA=$(sha256sum phase5-pre.pgcustom.age | cut -d' ' -f1)
          NAME="phase5-pre-offline-sync-${GITHUB_SHA}.pgcustom.age"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload and verify backup in both destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.backup.outputs.name }}"
          SHA="${{ steps.backup.outputs.sha }}"
          rclone copyto phase5-pre.pgcustom.age "b2:APD-BB/$NAME"
          test "$(rclone cat "b2:APD-BB/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          rclone copyto phase5-pre.pgcustom.age "r2:apd-dsb/$NAME"
          test "$(rclone cat "r2:apd-dsb/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          echo "Encrypted pre-Phase-5 backup verified in B2 and R2: $NAME"

      - name: Apply Phase 5 migration atomically
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/migrations/0029_phase5_sync.sql

      - name: Verify live Phase 5 security contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          begin
            if to_regclass('public.sync_conflicts') is null
               or to_regclass('public.sync_idempotency_keys') is null
               or to_regprocedure('public.phase5_sync_pull(text,uuid,integer,jsonb)') is null
               or to_regprocedure('public.phase5_sync_ack(text,integer,jsonb)') is null
               or to_regprocedure('public.phase5_sync_post_sale(text,integer,uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is null then
              raise exception 'Phase 5 live schema verification failed';
            end if;
            if has_table_privilege('authenticated','public.sync_conflicts','INSERT')
               or has_table_privilege('authenticated','public.sync_idempotency_keys','INSERT') then
              raise exception 'Direct authenticated sync-ledger write privilege detected';
            end if;
            if has_function_privilege('anon','public.phase5_sync_pull(text,uuid,integer,jsonb)','EXECUTE')
               or has_function_privilege('anon','public.phase5_sync_post_sale(text,integer,uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)','EXECUTE') then
              raise exception 'Anon can execute Phase 5 sync RPC';
            end if;
            if not has_function_privilege('authenticated','public.phase5_sync_pull(text,uuid,integer,jsonb)','EXECUTE')
               or not has_function_privilege('authenticated','public.phase5_sync_post_sale(text,integer,uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)','EXECUTE') then
              raise exception 'Authenticated role cannot execute Phase 5 sync RPC';
            end if;
            if not exists(select 1 from pg_class where oid='public.sync_conflicts'::regclass and relrowsecurity)
               or not exists(select 1 from pg_class where oid='public.sync_idempotency_keys'::regclass and relrowsecurity) then
              raise exception 'Phase 5 sync tables are missing RLS';
            end if;
          end $$;
          select 'Live Phase 5 schema/security verification: PASS';
          SQL

      - name: Verify nightly backup role still covers Phase 5 tables
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_RO_DATABASE_URL" || { echo 'BACKUP_RO_DATABASE_URL is required'; exit 1; }
          RESULT=$(psql "$BACKUP_RO_DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "
            select (select count(*) from sync_conflicts) >= 0
               and (select count(*) from sync_idempotency_keys) >= 0;")
          test "$RESULT" = "t" || { echo 'backup_ro cannot read the new Phase 5 tables'; exit 1; }
          echo "Live Phase 5 backup-role coverage: PASS"

  phase5_preview:
    needs: [build, phase5_db_upgrade]
    if: github.ref == 'refs/heads/phase-5-offline-sync' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Phase 5 offline preview
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: pnpm --filter @dsb-pro/admin run build
      - name: Deploy Phase 5 branch preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=dsb-pro --branch=phase-5-offline-sync


  deploy:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production deployment config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'VITE_SUPABASE_URL is required'; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo 'VITE_SUPABASE_ANON_KEY is required'; exit 1; }
      - name: Build Cloudflare Pages artifact with production config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: pnpm --filter @dsb-pro/admin run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/admin/dist --project-name=dsb-pro
      - name: Build GitHub Pages fallback artifact
        env:
          VITE_BASE_PATH: /dsb-pro/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: |
          pnpm --filter @dsb-pro/admin run build
          cp apps/admin/dist/index.html apps/admin/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin/dist
      - uses: actions/deploy-pages@v4


  phase6_db_upgrade:
    needs: [build]
    if: github.ref == 'refs/heads/phase-6-ledgers-reports-dr' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live Phase 6 starting point
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required'; exit 1; }
          BASE_OK=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select to_regclass('public.sync_conflicts') is not null and to_regprocedure('public.phase5_sync_pull(text,uuid,integer,jsonb)') is not null and to_regprocedure('public.phase5_sync_post_sale(text,integer,uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null;")
          test "$BASE_OK" = "t" || { echo 'Live database is not at verified Phase 5; refusing Phase 6 migration.'; exit 1; }
          PRESENT=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          with checks(present) as (
            values
              (to_regclass('public.expenses') is not null),
              (to_regclass('public.stock_counts') is not null),
              (to_regprocedure('public.get_day_book(uuid,date,date)') is not null),
              (to_regprocedure('public.phase6_export_tenant(uuid)') is not null),
              (to_regprocedure('public.check_invariants()') is not null)
          )
          select count(*) from checks where present;
          SQL
          )
          if [ "$PRESENT" = "5" ]; then
            echo "needs_upgrade=false" >> "$GITHUB_OUTPUT"
          elif [ "$PRESENT" = "0" ]; then
            echo "needs_upgrade=true" >> "$GITHUB_OUTPUT"
          else
            echo "Partial Phase 6 schema detected ($PRESENT/5). Refusing automatic migration."
            exit 1
          fi
      - name: Install backup tools
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17
      - name: Configure backup destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF
      - name: Verify backup encryption recipient
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'AGE_PUBLIC_KEY mismatch'; exit 1; }
      - name: Create encrypted pre-Phase-6 backup
        if: steps.preflight.outputs.needs_upgrade == 'true'
        id: backup
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --schema=public "$BACKUP_RO_DATABASE_URL" -f /dump/phase6-pre.pgcustom
          sudo chown "$(id -u):$(id -g)" phase6-pre.pgcustom
          test "$(stat -c%s phase6-pre.pgcustom)" -ge 1000
          age -r "$AGE_PUBLIC_KEY" -o phase6-pre.pgcustom.age phase6-pre.pgcustom
          echo "sha=$(sha256sum phase6-pre.pgcustom.age | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=phase6-pre-ledgers-reports-${GITHUB_SHA}.pgcustom.age" >> "$GITHUB_OUTPUT"
      - name: Upload and verify pre-migration backup
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          set -euo pipefail
          NAME="${{ steps.backup.outputs.name }}"
          SHA="${{ steps.backup.outputs.sha }}"
          rclone copyto phase6-pre.pgcustom.age "b2:APD-BB/$NAME"
          test "$(rclone cat "b2:APD-BB/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          rclone copyto phase6-pre.pgcustom.age "r2:apd-dsb/$NAME"
          test "$(rclone cat "r2:apd-dsb/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
      - name: Apply Phase 6 migration atomically
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/migrations/0030_phase6_ledgers_reports_dr.sql
      - name: Verify live Phase 6 contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          begin
            if to_regclass('public.expenses') is null
               or to_regclass('public.stock_counts') is null
               or to_regprocedure('public.get_day_book(uuid,date,date)') is null
               or to_regprocedure('public.phase6_export_tenant(uuid)') is null
               or to_regprocedure('public.check_invariants()') is null then
              raise exception 'Phase 6 live schema verification failed';
            end if;
            if has_table_privilege('authenticated','public.expenses','INSERT')
               or has_table_privilege('authenticated','public.stock_counts','INSERT') then
              raise exception 'Direct authenticated Phase 6 financial write detected';
            end if;
            if has_function_privilege('anon','public.post_expense(uuid,date,text,text,bigint,text,text,text)','EXECUTE')
               or has_function_privilege('anon','public.phase6_export_tenant(uuid)','EXECUTE') then
              raise exception 'Anon Phase 6 RPC execution detected';
            end if;
            if not exists(select 1 from pg_class where oid='public.expenses'::regclass and relrowsecurity)
               or not exists(select 1 from pg_class where oid='public.stock_counts'::regclass and relrowsecurity) then
              raise exception 'Phase 6 RLS missing';
            end if;
          end
          $verify$;
          SQL
      - name: Verify backup role covers Phase 6 tables
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
        run: |
          RESULT=$(psql "$BACKUP_RO_DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "select (select count(*) from expenses)>=0 and (select count(*) from stock_counts)>=0 and (select count(*) from stock_count_lines)>=0;")
          test "$RESULT" = "t"

  phase6_preview:
    needs: [build, phase6_db_upgrade]
    if: github.ref == 'refs/heads/phase-6-ledgers-reports-dr' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

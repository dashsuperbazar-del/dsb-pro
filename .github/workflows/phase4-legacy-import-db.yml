name: Phase 4 legacy-import DB support

on:
  push:
    branches: [phase-4-pos-customers-payments]
    paths:
      - '.github/workflows/phase4-legacy-import-db.yml'

concurrency:
  group: phase4-legacy-import-db
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether live import support is needed
        id: preflight
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required'; exit 1; }
          CORE=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select to_regclass('public.items') is not null and to_regclass('public.sale_invoices') is not null and to_regprocedure('public.post_sale(uuid,uuid,date,bigint,bigint,text,jsonb,jsonb,text)') is not null;")
          test "$CORE" = "t" || { echo 'Live database is not at the verified Phase 4 core state; refusing import-support migration.'; exit 1; }
          READY=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select to_regclass('public.legacy_import_runs') is not null and to_regprocedure('public.import_legacy_dsb_master(uuid,jsonb,text)') is not null;")
          if [ "$READY" = "t" ]; then
            echo "needs_upgrade=false" >> "$GITHUB_OUTPUT"
            echo "Legacy import support already exists."
          else
            echo "needs_upgrade=true" >> "$GITHUB_OUTPUT"
            echo "Legacy import support is missing and will be added after backup."
          fi

      - name: Install backup tools
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17

      - name: Configure backup destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}

          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF

      - name: Verify backup encryption recipient
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'AGE_PUBLIC_KEY does not match the expected offline key.'; exit 1; }

      - name: Create encrypted pre-import-support backup
        if: steps.preflight.outputs.needs_upgrade == 'true'
        id: backup
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_RO_DATABASE_URL" || { echo 'BACKUP_RO_DATABASE_URL is required'; exit 1; }
          docker run --rm -v "$PWD:/dump" postgres:17             pg_dump --format=custom --schema=public "$BACKUP_RO_DATABASE_URL" -f /dump/phase4-import-pre.pgcustom
          sudo chown "$(id -u):$(id -g)" phase4-import-pre.pgcustom
          test "$(stat -c%s phase4-import-pre.pgcustom)" -ge 1000 || { echo 'Pre-migration dump is suspiciously small.'; exit 1; }
          age -r "$AGE_PUBLIC_KEY" -o phase4-import-pre.pgcustom.age phase4-import-pre.pgcustom
          SHA=$(sha256sum phase4-import-pre.pgcustom.age | cut -d' ' -f1)
          NAME="phase4-pre-legacy-import-${GITHUB_SHA}.pgcustom.age"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload and verify backup in both destinations
        if: steps.preflight.outputs.needs_upgrade == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.backup.outputs.name }}"
          SHA="${{ steps.backup.outputs.sha }}"
          rclone copyto phase4-import-pre.pgcustom.age "b2:APD-BB/$NAME"
          test "$(rclone cat "b2:APD-BB/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          rclone copyto phase4-import-pre.pgcustom.age "r2:apd-dsb/$NAME"
          test "$(rclone cat "r2:apd-dsb/$NAME" | sha256sum | cut -d' ' -f1)" = "$SHA"
          echo "Encrypted pre-import-support backup verified in B2 and R2: $NAME"

      - name: Apply legacy-import support atomically
        if: steps.preflight.outputs.needs_upgrade == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f supabase/migrations/0027_phase4_legacy_import.sql

      - name: Verify live legacy-import security contract
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          begin
            if to_regclass('public.legacy_import_runs') is null
               or to_regprocedure('public.import_legacy_dsb_master(uuid,jsonb,text)') is null then
              raise exception 'legacy import support verification failed';
            end if;
            if has_table_privilege('authenticated','public.legacy_import_runs','INSERT')
               or has_table_privilege('authenticated','public.legacy_import_runs','UPDATE')
               or has_table_privilege('authenticated','public.legacy_import_runs','DELETE') then
              raise exception 'authenticated role has direct legacy-import control-table mutation';
            end if;
            if not has_function_privilege('authenticated','public.import_legacy_dsb_master(uuid,jsonb,text)','EXECUTE') then
              raise exception 'authenticated role cannot execute guarded legacy import RPC';
            end if;
          end $$;
          select 'Live legacy import support/security verification: PASS';
          SQL

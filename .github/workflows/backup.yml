name: Nightly backup

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF
      - name: Verify encryption recipient
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'Unexpected AGE recipient'; exit 1; }
      - name: Mark backup run as started
        id: start
        run: |
          RUN_ID=$(psql "${{ secrets.SUPABASE_DB_URL }}" -t -A -c "insert into backup_runs(started_at,status) values(now(),'running') returning id;" | head -n1)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Dump portable business data
        run: |
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --schema=public "${{ secrets.BACKUP_RO_DATABASE_URL }}" -f /dump/public.pgcustom
          sudo chown "$(id -u):$(id -g)" public.pgcustom
          test "$(stat -c%s public.pgcustom)" -ge 1000
      - name: Dump Supabase Auth separately
        run: |
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --data-only --schema=auth --table=auth.users "${{ secrets.SUPABASE_DB_URL }}" -f /dump/auth-users.pgcustom
          sudo chown "$(id -u):$(id -g)" auth-users.pgcustom
          test "$(stat -c%s auth-users.pgcustom)" -ge 500
      - name: Encrypt and checksum both layers
        id: checksum
        run: |
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o public.pgcustom.age public.pgcustom
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o auth-users.pgcustom.age auth-users.pgcustom
          echo "public_sha=$(sha256sum public.pgcustom.age|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "auth_sha=$(sha256sum auth-users.pgcustom.age|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build financial manifest
        id: manifest
        run: |
          MANIFEST=$(psql "${{ secrets.BACKUP_RO_DATABASE_URL }}" -At -c "select quote_literal(json_build_object(
            'scope','public','authArtifact','separate',
            'sale_count',(select count(*) from sale_invoices),'sale_total',(select coalesce(sum(total_paise),0) from sale_invoices where status='FINALIZED'),
            'payment_count',(select count(*) from payments),'payment_total',(select coalesce(sum(amount_paise),0) from payments where status='POSTED'),
            'purchase_count',(select count(*) from purchase_bills),'purchase_total',(select coalesce(sum(total_paise),0) from purchase_bills where status='POSTED'),
            'stock_movement_count',(select count(*) from stock_movements),
            'expense_count',(select count(*) from expenses),'expense_total',(select coalesce(sum(amount_paise),0) from expenses where status='POSTED')
          )::text);" | head -n1)
          echo "json=$MANIFEST" >> "$GITHUB_OUTPUT"
      - name: Upload both artifacts to B2 and R2 and verify
        run: |
          DATE=$(date +%F)
          for pair in "public.pgcustom.age:backup-$DATE.pgcustom.age:${{ steps.checksum.outputs.public_sha }}" "auth-users.pgcustom.age:auth-$DATE.pgcustom.age:${{ steps.checksum.outputs.auth_sha }}"; do
            IFS=: read SRC NAME SHA <<< "$pair"
            rclone copyto "$SRC" "b2:APD-BB/$NAME"
            test "$(rclone cat "b2:APD-BB/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"
            rclone copyto "$SRC" "r2:apd-dsb/$NAME"
            test "$(rclone cat "r2:apd-dsb/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"
          done
      - name: Mark backup succeeded
        if: success()
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
          MANIFEST_LITERAL: ${{ steps.manifest.outputs.json }}
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -c "update backup_runs set finished_at=now(),status='success',sha256='${{ steps.checksum.outputs.public_sha }}',destinations='[{"name":"b2","verified":true},{"name":"r2","verified":true}]'::jsonb,app_version='${{ github.sha }}',schema_version=2,manifest=($MANIFEST_LITERAL)::jsonb where id='$RUN_ID';"
      - name: Mark backup failed
        if: failure()
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -c "update backup_runs set finished_at=now(),status='failed',error='CI job failed — see Actions run ${{ github.run_id }}' where id='${{ steps.start.outputs.run_id }}';" || true

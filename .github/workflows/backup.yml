name: Nightly backup

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install tools
        run: |
          bash scripts/remove-chrome-apt-source.sh
          sudo apt-get update
          sudo apt-get install -y age rclone
          docker pull postgres:17
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF
      - name: Verify encryption recipient
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
        run: |
          EXPECTED="age1n4zj5ymapz5xsur6a5v3en6np5ary3pmmmndpaf5a0vhyeazed7qq3jnrq"
          test "$AGE_PUBLIC_KEY" = "$EXPECTED" || { echo 'Unexpected AGE recipient'; exit 1; }
      - name: Mark backup run as started
        id: start
        run: |
          RUN_ID=$(psql "${{ secrets.SUPABASE_DB_URL }}" -t -A -c "insert into backup_runs(started_at,status) values(now(),'running') returning id;" | head -n1)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Capture matching business snapshot and private document bytes
        env:
          DOCUMENT_SOURCE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DOCUMENT_DUMP_DB_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          DOCUMENT_SOURCE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          DOCUMENT_SOURCE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DOCUMENT_SOURCE_KEY" || { echo '::error::Repository secret SUPABASE_SERVICE_ROLE_KEY is not set; private bill documents cannot be backed up.'; exit 1; }
          node scripts/bill-document-backup-cli.mjs backup document-backup public.pgcustom
          node scripts/bill-document-backup-cli.mjs verify document-backup public.pgcustom
          test "$(stat -c%s public.pgcustom)" -ge 1000
          tar -czf documents.tar.gz -C document-backup .
      - name: Dump Supabase Auth separately
        run: |
          # Supabase Auth sign-in state spans the auth schema (including users,
          # identities and password hashes). Keep it separate from the portable
          # public-schema artifact, but protect the full auth data set.
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --data-only --schema=auth "${{ secrets.SUPABASE_DB_URL }}" -f /dump/auth.pgcustom
          sudo chown "$(id -u):$(id -g)" auth.pgcustom
          test "$(stat -c%s auth.pgcustom)" -ge 500
      - name: Encrypt and checksum all three layers
        id: checksum
        run: |
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o public.pgcustom.age public.pgcustom
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o auth.pgcustom.age auth.pgcustom
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o documents.tar.gz.age documents.tar.gz
          echo "public_sha=$(sha256sum public.pgcustom.age|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "auth_sha=$(sha256sum auth.pgcustom.age|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "documents_sha=$(sha256sum documents.tar.gz.age|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(date +%F)-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Assert live tenant invariants
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          declare r record; v_result jsonb;
          begin
            for r in
              select distinct on (tu.tenant_id) tu.tenant_id,tu.user_id,tu.role
              from tenant_users tu
              where tu.status='active' and tu.deleted_at is null
              order by tu.tenant_id,(tu.role='owner') desc,tu.created_at
            loop
              perform set_config('request.jwt.claims',jsonb_build_object(
                'sub',r.user_id,'role','authenticated','tenant_id',r.tenant_id,
                'app_role',r.role,'shop_ids','[]'::jsonb
              )::text,true);
              v_result:=check_invariants();
              if not coalesce((v_result->>'ok')::boolean,false) then
                raise exception 'nightly invariant failure for tenant %: %',r.tenant_id,v_result;
              end if;
            end loop;
          end $verify$;
          SQL
      - name: Build financial manifest from the captured snapshot
        id: manifest
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const m=JSON.parse(readFileSync('document-backup/manifest.json','utf8'));
          writeFileSync('backup-record.json',JSON.stringify({...m.summary,liveInvariants:'pass',documents:{installed:m.installed,count:m.objects.length,references:m.references.length,unusedRetained:m.unusedUploads.length,publicDumpSha256:m.publicDumpSha256}}),{mode:0o600});
          JS
      - name: Upload all three artifacts to B2 and R2 and verify
        run: |
          set -euo pipefail
          SET_NAME="${{ steps.checksum.outputs.name }}"
          for pair in "public.pgcustom.age:backup-$SET_NAME.pgcustom.age:${{ steps.checksum.outputs.public_sha }}" "auth.pgcustom.age:auth-$SET_NAME.pgcustom.age:${{ steps.checksum.outputs.auth_sha }}" "documents.tar.gz.age:documents-$SET_NAME.tar.gz.age:${{ steps.checksum.outputs.documents_sha }}"; do
            IFS=: read SRC NAME SHA <<< "$pair"
            rclone copyto "$SRC" "b2:APD-BB/$NAME"
            test "$(rclone cat "b2:APD-BB/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"
            rclone copyto "$SRC" "r2:apd-dsb/$NAME"
            test "$(rclone cat "r2:apd-dsb/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"
          done
      - name: Mark backup succeeded
        if: success()
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
          PUBLIC_SHA: ${{ steps.checksum.outputs.public_sha }}
          AUTH_SHA: ${{ steps.checksum.outputs.auth_sha }}
          DOCUMENTS_SHA: ${{ steps.checksum.outputs.documents_sha }}
          BACKUP_NAME: ${{ steps.checksum.outputs.name }}
          APP_VERSION: ${{ github.sha }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # The previous version wrote the destinations array as a JSON literal
          # inside a double-quoted `psql -c "..."` string. Bash consumed the
          # inner double quotes, so Postgres received [{name:b2,...}] and
          # rejected it — run 34787124875 failed here *after* both artifacts
          # were already uploaded and checksum-verified, leaving good backups
          # with no provable record. The array is now built server-side and
          # every value is passed as a psql variable, so no shell quoting is
          # involved. It also records a per-artifact row, which the old
          # two-element array could not express now that Auth is dumped
          # separately.
          MANIFEST_JSON=$(cat backup-record.json)
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v run_id="$RUN_ID" \
            -v public_sha="$PUBLIC_SHA" \
            -v auth_sha="$AUTH_SHA" \
            -v documents_sha="$DOCUMENTS_SHA" \
            -v backup_name="$BACKUP_NAME" \
            -v app_version="$APP_VERSION" \
            -v manifest="$MANIFEST_JSON" <<'SQL'
          update backup_runs
             set finished_at    = now(),
                 status         = 'success',
                 sha256         = :'public_sha',
                 destinations   = json_build_array(
                     json_build_object('name','b2','artifact','public','verified',true,'sha256',:'public_sha','file','backup-'||:'backup_name'||'.pgcustom.age'),
                     json_build_object('name','r2','artifact','public','verified',true,'sha256',:'public_sha','file','backup-'||:'backup_name'||'.pgcustom.age'),
                     json_build_object('name','b2','artifact','auth','verified',true,'sha256',:'auth_sha','file','auth-'||:'backup_name'||'.pgcustom.age'),
                     json_build_object('name','r2','artifact','auth','verified',true,'sha256',:'auth_sha','file','auth-'||:'backup_name'||'.pgcustom.age'),
                     json_build_object('name','b2','artifact','documents','verified',true,'sha256',:'documents_sha','file','documents-'||:'backup_name'||'.tar.gz.age'),
                     json_build_object('name','r2','artifact','documents','verified',true,'sha256',:'documents_sha','file','documents-'||:'backup_name'||'.tar.gz.age')
                   )::jsonb,
                 app_version    = :'app_version',
                 schema_version = 4,
                 manifest       = :'manifest'::jsonb || jsonb_build_object('artifactSet',:'backup_name')
           where id = :'run_id';
          SQL
      - name: Mark backup failed
        if: failure()
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" -c "update backup_runs set finished_at=now(),status='failed',error='CI job failed — see Actions run ${{ github.run_id }}' where id='${{ steps.start.outputs.run_id }}';" || true
      - name: Remove plaintext business/Auth/document files
        if: always()
        run: |
          rm -f public.pgcustom auth.pgcustom documents.tar.gz backup-record.json
          rm -rf document-backup

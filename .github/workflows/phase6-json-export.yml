name: Phase 6 nightly human-readable export

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone postgresql-client gzip
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<CONF
          [b2]
          type = b2
          account = ${{ secrets.B2_ACCOUNT_ID }}
          key = ${{ secrets.B2_APPLICATION_KEY }}
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          no_check_bucket = true
          CONF
      - name: Export provider-independent JSON
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$DB" -At -c "select jsonb_pretty(jsonb_build_object(
            'exportedAt',clock_timestamp(),
            'tenants',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from tenants) x),'[]'::jsonb),
            'shops',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from shops) x),'[]'::jsonb),
            'items',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from items) x),'[]'::jsonb),
            'parties',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from parties) x),'[]'::jsonb),
            'customers',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from customers) x),'[]'::jsonb),
            'purchase_bills',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from purchase_bills) x),'[]'::jsonb),
            'purchase_bill_items',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from purchase_bill_items) x),'[]'::jsonb),
            'sale_invoices',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from sale_invoices) x),'[]'::jsonb),
            'sale_invoice_items',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from sale_invoice_items) x),'[]'::jsonb),
            'payments',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from payments) x),'[]'::jsonb),
            'payment_allocations',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from payment_allocations) x),'[]'::jsonb),
            'stock_movements',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from stock_movements) x),'[]'::jsonb),
            'expenses',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from expenses) x),'[]'::jsonb),
            'stock_counts',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from stock_counts) x),'[]'::jsonb),
            'stock_count_lines',coalesce((select jsonb_agg(to_jsonb(x)) from (select * from stock_count_lines) x),'[]'::jsonb)
          ));" > export.json
          gzip -9 export.json
          age -r "${{ vars.AGE_PUBLIC_KEY }}" -o export.json.gz.age export.json.gz
          sha256sum export.json.gz.age > export.sha256
      - name: Upload and verify
        run: |
          set -euo pipefail
          NAME="export-$(date +%F).json.gz.age"
          SHA=$(cut -d' ' -f1 export.sha256)
          rclone copyto export.json.gz.age "b2:APD-BB/exports/$NAME"
          test "$(rclone cat "b2:APD-BB/exports/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"
          rclone copyto export.json.gz.age "r2:apd-dsb/exports/$NAME"
          test "$(rclone cat "r2:apd-dsb/exports/$NAME"|sha256sum|cut -d' ' -f1)" = "$SHA"

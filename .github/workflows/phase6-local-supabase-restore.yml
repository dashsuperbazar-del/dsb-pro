name: Phase 6 local Supabase restore proof

on:
  push:
    branches: [phase-6-ledgers-reports-dr]
  schedule:
    # Runs from main after the phase stack is consolidated.
    - cron: '0 20 * * 1'
  workflow_dispatch:

concurrency:
  group: phase6-local-supabase-restore
  cancel-in-progress: true

jobs:
  restore_public_and_auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Require live read credentials
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$BACKUP_RO_DATABASE_URL" || { echo 'BACKUP_RO_DATABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_DB_URL" || { echo 'SUPABASE_DB_URL is required'; exit 1; }

      - name: Capture source recovery manifest
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          {
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'auth_users='||count(*) from auth.users; select 'auth_identities='||count(*) from auth.identities;"
            psql "$BACKUP_RO_DATABASE_URL" -v ON_ERROR_STOP=1 -At <<'SQL'
          select 'tenant_users='||count(*) from tenant_users;
          select 'sales='||count(*)||',total='||coalesce(sum(total_paise),0) from sale_invoices where status='FINALIZED';
          select 'payments='||count(*)||',total='||coalesce(sum(amount_paise),0) from payments where status='POSTED';
          select 'purchases='||count(*)||',total='||coalesce(sum(total_paise),0) from purchase_bills where status='POSTED';
          select 'stock_movements='||count(*) from stock_movements;
          select 'expenses='||count(*)||',total='||coalesce(sum(amount_paise),0) from expenses where status='POSTED';
          SQL
          } > source-manifest.txt
          cat source-manifest.txt

      - name: Create fresh public and Auth dumps
        env:
          BACKUP_RO_DATABASE_URL: ${{ secrets.BACKUP_RO_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --schema=public "$BACKUP_RO_DATABASE_URL" -f /dump/phase6-public.pgcustom
          docker run --rm -v "$PWD:/dump" postgres:17 pg_dump --format=custom --data-only --schema=auth "$SUPABASE_DB_URL" -f /dump/phase6-auth.pgcustom
          sudo chown "$(id -u):$(id -g)" phase6-public.pgcustom phase6-auth.pgcustom
          test "$(stat -c%s phase6-public.pgcustom)" -ge 1000
          test "$(stat -c%s phase6-auth.pgcustom)" -ge 500

      - name: Start genuinely fresh disposable Supabase target
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
          sudo fuser -k 54321/tcp 54322/tcp 54323/tcp 54324/tcp 54325/tcp 54326/tcp 54327/tcp 54328/tcp 54329/tcp || true
          # Mailpit is only a local email viewer; the DR proof does not send email.
          # Excluding it avoids an irrelevant host-port collision on 54324 while
          # keeping Postgres, GoTrue Auth, PostgREST and Kong fully exercised.
          supabase start -x mailpit
          supabase db reset

      - name: Restore public business data and critical Auth identity
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          bash scripts/restore-to-local-supabase.sh "$PWD/phase6-public.pgcustom" "$PWD/phase6-auth.pgcustom" \
            'postgresql://postgres:postgres@127.0.0.1:54322/postgres' | tee restored-manifest.txt
          END=$(date +%s)
          echo "restore_seconds=$((END-START))" | tee -a restored-manifest.txt
          grep -F 'LOCAL SUPABASE PUBLIC + AUTH RESTORE: PASS' restored-manifest.txt

      - name: Verify recovery parity and invariants
        shell: bash
        run: |
          set -euo pipefail
          for key in auth_users auth_identities tenant_users sales payments purchases stock_movements expenses; do
            expected=$(grep "^${key}=" source-manifest.txt | tail -n1)
            test -n "$expected" || { echo "Source manifest missing $key"; exit 1; }
            grep -Fx "$expected" restored-manifest.txt >/dev/null || {
              echo "Restore parity mismatch for $key"
              echo "expected: $expected"
              grep "^${key}=" restored-manifest.txt || true
              exit 1
            }
          done
          grep -Fx 'missing_membership_users=0' restored-manifest.txt >/dev/null
          grep -Fx 'invariants=pass' restored-manifest.txt >/dev/null
          echo 'Phase 6 disposable Supabase public/Auth restore parity: PASS'

      - name: Prove recovered Auth login and tenant RLS
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          PROOF_EMAIL='phase6-recovered-login@local.test'
          PROOF_PASSWORD='Phase6-Recovered-Login-2026!'
          read -r USER_ID TENANT_ID <<<"$(psql "$DB_URL" -At -F' ' -c "select tu.user_id,tu.tenant_id from tenant_users tu join auth.users u on u.id=tu.user_id where tu.status='active' and tu.deleted_at is null order by (tu.role='owner') desc,tu.created_at limit 1")"
          test -n "$USER_ID"
          test -n "$TENANT_ID"
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=')"
          # A recovery operator will not know the restored user's original
          # password. The operator already has database access to perform the
          # restore, so reset exactly the selected recovered account in Auth.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -v proof_email="$PROOF_EMAIL" -v proof_password="$PROOF_PASSWORD" <<'SQL'
          update auth.users
          set email=:'proof_email',
              aud='authenticated',
              role='authenticated',
              is_sso_user=false,
              is_anonymous=false,
              banned_until=null,
              deleted_at=null,
              encrypted_password=extensions.crypt(:'proof_password',extensions.gen_salt('bf')),
              email_confirmed_at=coalesce(email_confirmed_at,now()),
              confirmation_token='',
              recovery_token='',
              email_change='',
              email_change_token_new='',
              updated_at=now()
          where id=:'user_id'::uuid;
          SQL
          RESET_USER_COUNT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -v user_id="$USER_ID" -At <<'SQL'
          select count(*) from auth.users
          where id=:'user_id'::uuid and encrypted_password is not null;
          SQL
          )
          test "$RESET_USER_COUNT" = '1'
          AUTH_RESPONSE=$(mktemp)
          AUTH_CURL_EXIT=0
          AUTH_STATUS=$(/usr/bin/curl -q -sS -o "$AUTH_RESPONSE" -w '%{http_code}' "$API_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H 'Content-Type: application/json' --data "{\"email\":\"$PROOF_EMAIL\",\"password\":\"$PROOF_PASSWORD\"}") || AUTH_CURL_EXIT=$?
          if [ "$AUTH_STATUS" != '200' ]; then
            echo "Recovered Auth password login failed with HTTP $AUTH_STATUS (curl exit $AUTH_CURL_EXIT)"
            jq -c '{code,error_code,msg,message}' "$AUTH_RESPONSE" 2>/dev/null || echo 'Auth returned a non-JSON error body'
            exit 1
          fi
          TOKEN=$(jq -r '.access_token // empty' "$AUTH_RESPONSE")
          test -n "$TOKEN" || { echo 'Recovered Auth password login did not return a token'; exit 1; }
          TOKEN_PAYLOAD=$(cut -d. -f2 <<<"$TOKEN" | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' | base64 -d)
          test "$(jq -r '.role // empty' <<<"$TOKEN_PAYLOAD")" = 'authenticated'
          test "$(jq -r '.tenant_id // empty' <<<"$TOKEN_PAYLOAD")" = "$TENANT_ID"
          TENANT_RESPONSE=$(mktemp)
          TENANT_CURL_EXIT=0
          TENANT_STATUS=$(/usr/bin/curl -q -sS -o "$TENANT_RESPONSE" -w '%{http_code}' "$API_URL/rest/v1/tenants?select=id" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $TOKEN") || TENANT_CURL_EXIT=$?
          if [ "$TENANT_STATUS" != '200' ]; then
            echo "Recovered tenant RLS read failed with HTTP $TENANT_STATUS (curl exit $TENANT_CURL_EXIT)"
            jq -c '{code,details,hint,message}' "$TENANT_RESPONSE" 2>/dev/null || echo 'REST returned a non-JSON error body'
            psql "$DB_URL" -At <<'SQL'
          select 'authenticated_tenants_select='||has_table_privilege('authenticated','public.tenants','select');
          select 'authenticated_current_tenant_execute='||has_function_privilege('authenticated','public.current_tenant_id()','execute');
          SQL
            exit 1
          fi
          TENANTS=$(cat "$TENANT_RESPONSE")
          test "$(jq 'length' <<<"$TENANTS")" = '1'
          test "$(jq -r '.[0].id' <<<"$TENANTS")" = "$TENANT_ID"
          echo 'RECOVERED AUTH LOGIN + TENANT RLS: PASS'

name: POS money-path stability

# Repeats the money-path spec many times against a throwaway local Supabase to
# tell a real intermittent defect apart from a lucky green run. pos.spec.ts
# failed on two of three runs before the mapped-option keys landed, and has
# passed three times since; neither sample is large enough to conclude
# anything, and a single green CI run never will be.
#
# This workflow deliberately uses NO live-database secrets. It is the safe way
# to buy confidence in the billing path: re-dispatching the main CI workflow
# would also fire phase6_db_upgrade against the live financial database.

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: How many times to repeat the money-path spec
        required: false
        default: '10'
      spec:
        description: Spec file to repeat
        required: false
        default: e2e/pos.spec.ts
  schedule:
    # Thursday, away from the Sunday CI cron and the nightly backup window.
    - cron: '0 19 * * 4'

jobs:
  money_path_repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Clear stale Supabase containers and ports
        run: |
          docker ps -aq --filter 'name=supabase_' | xargs -r docker rm -f
          sudo fuser -k 54321/tcp 54322/tcp 54323/tcp 54324/tcp 54325/tcp 54326/tcp 54327/tcp 54328/tcp 54329/tcp || true
      - run: supabase start
      - name: Export local Supabase URL/anon key
        run: |
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - run: supabase db reset
      - run: pnpm --filter @dsb-pro/admin run build
      - name: Install Playwright Chromium and OS dependencies
        run: |
          grep -RIl 'dl.google.com/linux/chrome' /etc/apt/sources.list.d 2>/dev/null | while IFS= read -r source; do
            sudo rm -f "$source"
          done
          pnpm --filter @dsb-pro/admin exec playwright install --with-deps chromium
      - name: Repeat the money path
        env:
          REPS: ${{ inputs.repetitions || '10' }}
          SPEC: ${{ inputs.spec || 'e2e/pos.spec.ts' }}
        run: |
          set -euo pipefail
          echo "Repeating $SPEC x$REPS. Any single failure fails this gate:"
          echo "an intermittent defect on the billing path is a defect."
          pnpm --filter @dsb-pro/admin exec playwright test "$SPEC" --repeat-each="$REPS"
      - name: Upload Playwright trace and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: money-path-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/admin/test-results/
            apps/admin/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

name: Phase 6 R2 preview gate

on:
  push:
    branches: [phase-6-ledgers-reports-dr]
  workflow_dispatch:

concurrency:
  group: phase6-r2-preview-gate
  cancel-in-progress: true

jobs:
  r2_preview_binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build preview with R2 storage adapter selected
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_ITEM_IMAGE_STORAGE_PROVIDER: r2
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zmtvvdgsbdwhowrzkcwr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InptdHZ2ZGdzYmR3aG93cnprY3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY2NjgsImV4cCI6MjEwNDA5MjY2OH0.I6O33AReqJBkKwgtzejlS31Djwmdrp5pVF6Mxj4gnig' }}
        run: pnpm --filter @dsb-pro/admin run build

      - name: Deploy R2-selected branch preview with Pages Functions
        id: deploy_r2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          command: pages deploy dist --project-name=dsb-pro --branch=phase-6-r2-drill

      - name: Prove real preview has ITEM_IMAGES R2 binding
        env:
          DEPLOYMENT_URL: ${{ steps.deploy_r2.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy_r2.outputs.pages-deployment-alias-url }}
        shell: bash
        run: |
          set -euo pipefail
          URL="${ALIAS_URL:-$DEPLOYMENT_URL}"
          test -n "$URL" || { echo 'Cloudflare preview URL was not returned'; exit 1; }
          for i in $(seq 1 20); do
            STATUS=$(curl -sS -o response.txt -w '%{http_code}' "$URL/api/item-images?path=phase6-binding-probe" || true)
            if [ "$STATUS" = "401" ]; then
              echo 'R2 preview binding gate: PASS (Pages Function deployed, R2 binding exists, unauthenticated probe rejected as designed).'
              exit 0
            fi
            if [ "$STATUS" = "503" ]; then
              echo 'R2 preview binding gate: FAIL — Pages Function is live but ITEM_IMAGES is not bound in the Cloudflare Pages preview environment.'
              cat response.txt
              exit 1
            fi
            sleep 3
          done
          echo "R2 preview binding gate: FAIL — unexpected HTTP $STATUS"
          cat response.txt
          exit 1
